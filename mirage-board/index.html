<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirage A Site - Board Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Mirage A Site - Board Prototype</h1>
      <div class="controls">
        <button id="resetBtn" class="btn">Reset tokens</button>
        <label class="toggle">
          <input id="snapToggle" type="checkbox" checked />
          <span>Snap to nodes</span>
        </label>
      </div>
    </header>

    <main class="app-main">
      <div class="board-wrapper">
        <!-- SVG board: not to scale, but layout approximates key landmarks -->
        <svg id="board" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" aria-label="Mirage A Site Board">
          <!-- Background / floor plan approximation -->
          <defs>
            <linearGradient id="floorGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2f3640" />
              <stop offset="100%" stop-color="#353b48" />
            </linearGradient>
            <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35" />
            </filter>
          </defs>

          <rect x="0" y="0" width="1000" height="700" fill="url(#floorGradient)" />

          <!-- Rough shapes to imply structures (stylized, not accurate) -->
          <!-- Tetris / Default box area -->
          <rect x="520" y="310" width="120" height="90" rx="6" ry="6" fill="#5c6b73" opacity="0.7" />
          <!-- Triple boxes near default -->
          <rect x="470" y="330" width="40" height="30" fill="#6b7b83" opacity="0.8" />
          <rect x="470" y="365" width="40" height="30" fill="#6b7b83" opacity="0.8" />
          <rect x="470" y="295" width="40" height="30" fill="#6b7b83" opacity="0.8" />

          <!-- Ticket/CT wall -->
          <rect x="720" y="250" width="180" height="170" fill="#414b57" opacity="0.9" />

          <!-- Jungle / Connector wall hint -->
          <rect x="640" y="120" width="120" height="110" fill="#3d4752" opacity="0.85" />

          <!-- Stairs wedge -->
          <polygon points="400,520 460,520 520,580 400,600" fill="#47535e" opacity="0.9" />

          <!-- Ramp corridor -->
          <polygon points="260,600 400,600 520,700 260,700" fill="#4b5966" opacity="0.8" />

          <!-- Scaffold left/right hints -->
          <rect x="320" y="440" width="40" height="120" fill="#55636f" opacity="0.9" />
          <rect x="360" y="440" width="40" height="120" fill="#55636f" opacity="0.9" />

          <!-- Node group -->
          <g id="nodes" fill="#f1f2f6" stroke="#1e272e" stroke-width="2">
            <!-- Coordinates are approximate; tweak in script if needed -->
            <g class="node" data-id="ramp" transform="translate(340,650)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Ramp</text>
            </g>
            <g class="node" data-id="stairs" transform="translate(460,560)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Stairs</text>
            </g>
            <g class="node" data-id="jungle" transform="translate(680,170)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Jungle</text>
            </g>
            <g class="node" data-id="ct" transform="translate(810,320)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">CT (Ticket)</text>
            </g>
            <g class="node" data-id="default" transform="translate(540,355)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Default</text>
            </g>
            <g class="node" data-id="ninja" transform="translate(600,325)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Ninja</text>
            </g>
            <g class="node" data-id="xbox" transform="translate(490,345)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Xbox</text>
            </g>
            <g class="node" data-id="upper-scaf" transform="translate(360,470)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Upper Scaf</text>
            </g>
            <g class="node" data-id="lower-scaf" transform="translate(360,530)">
              <circle r="18" class="node-circle" />
              <text y="-28" class="node-label">Lower Scaf</text>
            </g>
          </g>

          <!-- Token spawn shelf (left) -->
          <g id="token-shelf" transform="translate(40,60)">
            <rect x="-20" y="-20" width="140" height="260" rx="8" ry="8" fill="#2b3139" stroke="#1e242b" stroke-width="2" filter="url(#shadow)"/>
            <text x="10" y="10" class="shelf-title">Tokens</text>
            <g class="token" data-color="#ff6b6b" transform="translate(10,30)">
              <circle r="16" fill="#ff6b6b" stroke="#1e272e" stroke-width="2" />
              <text x="0" y="5" class="token-text">T</text>
            </g>
            <g class="token" data-color="#4dabf7" transform="translate(10,70)">
              <circle r="16" fill="#4dabf7" stroke="#1e272e" stroke-width="2" />
              <text x="0" y="5" class="token-text">CT</text>
            </g>
            <g class="token" data-color="#ffd43b" transform="translate(10,110)">
              <circle r="16" fill="#ffd43b" stroke="#1e272e" stroke-width="2" />
              <text x="0" y="5" class="token-text">B</text>
            </g>
            <g class="token" data-color="#94d82d" transform="translate(10,150)">
              <circle r="16" fill="#94d82d" stroke="#1e272e" stroke-width="2" />
              <text x="0" y="5" class="token-text">U</text>
            </g>
            <g class="token" data-color="#be4bdb" transform="translate(10,190)">
              <circle r="16" fill="#be4bdb" stroke="#1e272e" stroke-width="2" />
              <text x="0" y="5" class="token-text">X</text>
            </g>
          </g>
        </svg>
      </div>
    </main>

    <footer class="app-footer">
      <div>Drag tokens onto nodes. Toggle snapping to place tokens between nodes.</div>
    </footer>

    <script src="script.js"></script>
  </body>
  </html>
